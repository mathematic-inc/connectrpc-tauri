[workspace]
resolver = "3"
members = ["crates/connectrpc-tauri", "examples/greet-app/src-tauri", "tools/protobuf-bindings"]

[workspace.package]
edition = "2024"
rust-version = "1.90"
repository = "https://github.com/mathematic-inc/connectrpc-tauri"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
buffa = { version = "0.9.2", default-features = false, features = ["fast-utf8", "json", "std"] }
bytes = "1.12.1"
connectrpc = { version = "0.9.1", default-features = false, features = ["json"] }
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", default-features = false }
tokio = { version = "1.54.1", features = ["rt", "sync"] }
tower = "0.5.3"
tracing = "0.1.44"
