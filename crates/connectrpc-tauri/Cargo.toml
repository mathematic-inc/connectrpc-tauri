[package]
name = "connectrpc-tauri"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
description = "ConnectRPC transport over Tauri IPC (commands + channels)"
readme = "README.md"
repository.workspace = true
license.workspace = true
keywords = ["connectrpc", "grpc", "ipc", "rpc", "tauri"]
categories = ["gui", "network-programming"]
# Required by Tauri's ACL: the plugin's permissions are keyed on this.
links = "connectrpc-tauri"

[package.metadata.docs.rs]
all-features = true

# The test drives the demo service through the test harness, so it needs both
# features. `required-features` states that directly; a self dev-dependency
# would do the same but reads as a dependency cycle to tooling.
[[test]]
name = "transport"
required-features = ["greet-example", "testing"]

[dependencies]
buffa.workspace = true
bytes.workspace = true
connectrpc.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tokio.workspace = true
tower.workspace = true
tracing.workspace = true

[dev-dependencies]
futures = "0.3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[build-dependencies]
connectrpc-build = "0.8"
tauri-plugin = { version = "2.6.3", features = ["build"] }

[features]
# Generated bindings for the demo `greet.v1` service, used by tests and the
# example app.
greet-example = []
# Harness for driving the transport without a webview.
testing = []
