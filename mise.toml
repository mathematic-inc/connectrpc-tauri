[settings]
all_compile = false
cargo.binstall_native = true
idiomatic_version_file_enable_tools = ["node", "pnpm", "python", "ruff", "rust"]
npm.package_manager = "npm"

[tools]
actionlint = "1.7.12"
buf = "1.75.0"
ghalint = "1.6.0"
gitleaks = "8.30.1"
harper-cli = "3.0.0"
hk = "2.11.1"
jq = "1.8.2"
lychee = "0.24.2"
node = "26.13.0"
npm = { version = "12.2.2", depends = ["node"] }
oxfmt = { version = "0.77.0", depends = ["node"] }
oxlint = { version = "1.92.0", depends = ["node"] }
pinact = "5.0.2"
protoc = "36.2"
python = "3.15.2"
rumdl = "0.3.2"
rust = { version = "1.99.1", profile = "minimal", components = [
  "clippy",
  "rustfmt",
] }
shellcheck = "0.11.0"
shfmt = "3.14.1"
tombi = "1.10.0"
typos = "1.52.0"
uv = "0.13.7"
zizmor = "1.32.0"
"aqua:EmbarkStudios/cargo-deny" = { version = "0.20.2", depends = ["rust"] }
"aqua:anordal/shellharden" = "4.3.2"
"aqua:apple/pkl" = "0.33.0"
"aqua:owenlamont/ryl" = "0.29.0"
"github:mongodb/kingfisher" = "2.17.0"
"github:QuiiBz/sherif" = "1.13.0"
"npm:knip" = { version = "6.44.2", depends = ["node"] }
"npm:sort-package-json" = { version = "4.1.0", depends = ["node"] }
"pipx:yamllint" = { version = "1.38.0", depends = ["python", "uv"] }
