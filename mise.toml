[settings]
all_compile = false
cargo.binstall_native = true
idiomatic_version_file_enable_tools = ["node", "pnpm", "python", "ruff", "rust"]
npm.package_manager = "npm"

[tools]
actionlint = "1.7.12"
buf = "1.72.0"
ghalint = "1.5.6"
gitleaks = "8.30.1"
harper-cli = "2.8.0"
hk = "1.57.0"
jq = "1.8.2"
lychee = "0.24.2"
node = "26.8.1"
npm = { version = "12.0.2", depends = ["node"] }
oxfmt = { version = "0.66.0", depends = ["node"] }
oxlint = { version = "1.80.0", depends = ["node"] }
pinact = "4.1.1"
protoc = "36.1"
python = "3.14.7"
rumdl = "0.2.62"
rust = { version = "1.98.0", profile = "minimal", components = [
  "clippy",
  "rustfmt",
] }
shellcheck = "0.11.0"
shfmt = "3.14.0"
tombi = "1.5.0"
typos = "1.50.0"
uv = "0.12.8"
zizmor = "1.30.0"
"aqua:EmbarkStudios/cargo-deny" = { version = "0.20.2", depends = ["rust"] }
"aqua:anordal/shellharden" = "4.3.2"
"aqua:apple/pkl" = "0.32.1"
"aqua:owenlamont/ryl" = "0.21.0"
"github:mongodb/kingfisher" = "2.1.0"
"github:QuiiBz/sherif" = "1.13.0"
"npm:knip" = { version = "6.34.0", depends = ["node"] }
"npm:sort-package-json" = { version = "4.0.0", depends = ["node"] }
"pipx:yamllint" = { version = "1.38.0", depends = ["python", "uv"] }
