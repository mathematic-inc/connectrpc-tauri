name: Dependency audit

on:
  schedule:
    - cron: "31 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-deny:
    name: Cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install: false
      - run: mise install rust aqua:EmbarkStudios/cargo-deny
      - run: mise exec -- cargo-deny --locked --workspace check
