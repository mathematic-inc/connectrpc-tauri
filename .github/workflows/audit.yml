name: Dependency audit

on:
  schedule:
    - cron: "31 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-deny:
    name: Cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install: false
      - run: mise install rust aqua:EmbarkStudios/cargo-deny
      - run: mise exec -- cargo-deny --locked --workspace check
