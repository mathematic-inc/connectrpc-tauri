name: Release

on:
  push:
    tags:
      - "v*" # the crate, connectrpc-tauri
      - "transport-v*" # the npm package, @connectrpc-tauri/transport

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  meta:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      target: ${{ steps.parse.outputs.target }}
      tag: ${{ steps.parse.outputs.tag }}
      version: ${{ steps.parse.outputs.version }}
      is_prerelease: ${{ steps.parse.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: parse
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          # release-please emits unscoped `v<version>` tags for the crate and
          # `transport-v<version>` for the npm package.
          if [[ "$TAG" =~ ^v[0-9] ]]; then
            TARGET="crate"
            VERSION="${TAG#v}"
            MANIFEST_VERSION="$(cargo metadata --format-version 1 --no-deps \
              | jq -r '.packages[] | select(.name == "connectrpc-tauri") | .version')"
          else
            TARGET="npm"
            VERSION="${TAG##*-v}"
            MANIFEST_VERSION="$(node -p "require('./packages/transport/package.json').version")"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "tag $TAG does not match vX.Y.Z or vX.Y.Z-rc.N" >&2
            exit 1
          fi

          if [[ "$VERSION" != "$MANIFEST_VERSION" ]]; then
            echo "tag version $VERSION must match manifest version $MANIFEST_VERSION" >&2
            exit 1
          fi

          IS_PRERELEASE=false
          if [[ "$VERSION" == *-* ]]; then
            IS_PRERELEASE=true
          fi

          {
            echo "target=$TARGET"
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "is_prerelease=$IS_PRERELEASE"
          } >> "$GITHUB_OUTPUT"

  build-and-test:
    name: Build and test
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust-build # zizmor: ignore[self-repository]
        if: needs.meta.outputs.target == 'crate'
        with:
          cache: "false"
      - name: Test crate
        if: needs.meta.outputs.target == 'crate'
        run: cargo test --locked --all-features -p connectrpc-tauri

      # Caching is off in release jobs, so there is no cache to poison.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 # zizmor: ignore[cache-poisoning]
        if: needs.meta.outputs.target == 'npm'
        with:
          node-version-file: .node-version
      - name: Test package
        if: needs.meta.outputs.target == 'npm'
        run: |
          npm ci
          npm test
          npm run build

  create-release:
    name: Create GitHub release
    needs: [meta, build-and-test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3 # zizmor: ignore[superfluous-actions]
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: ${{ needs.meta.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ needs.meta.outputs.is_prerelease == 'true' }}
          make_latest: ${{ needs.meta.outputs.target == 'crate' && needs.meta.outputs.is_prerelease == 'false' }}

  publish-crate:
    name: Publish to crates.io
    needs: [meta, create-release]
    if: needs.meta.outputs.target == 'crate'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      # Trusted publishing: exchanged for a short-lived crates.io token, so no
      # long-lived registry secret lives in this repo.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-build # zizmor: ignore[self-repository]
        with:
          cache: "false"
      - name: Authenticate with crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish crate
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
          # Via the environment, not string-interpolated into the script: the
          # version comes from a tag name, which is attacker-controllable.
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          # A re-run of an already-published version is a no-op, not a failure.
          if output=$(cargo publish --locked -p connectrpc-tauri 2>&1); then
            echo "$output"
          elif grep -q "already exists on crates.io index" <<<"$output"; then
            echo "connectrpc-tauri ${VERSION} already published, skipping."
          else
            echo "$output" >&2
            exit 1
          fi

  publish-npm:
    name: Publish to npm
    needs: [meta, create-release]
    if: needs.meta.outputs.target == 'npm'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      # Trusted publishing again, which also gets provenance for free.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Caching is off in release jobs, so there is no cache to poison.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 # zizmor: ignore[cache-poisoning]
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - name: Publish package
        run: npm publish --workspace @connectrpc-tauri/transport
