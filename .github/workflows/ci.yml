name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # `hk check` is the single source of truth for lint and format, so CI and the
  # pre-commit hook cannot disagree. It covers rustfmt, clippy, cargo-deny, the
  # workflow linters, typecheck, vitest, and protobuf-binding drift.
  lint:
    name: hk check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # `gitleaks` scans history with `--log-opts=--all`, which a shallow
          # clone would silently narrow to one commit.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-build
      - name: Install dependencies
        # `knip`, `sherif`, `typecheck`, and `vitest` steps run through npm.
        run: npm ci
      - name: Run every check
        run: hk check --all

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-build
      # `hk` does not run the test suite; it is a lint and format runner.
      - name: Run tests
        run: cargo test --workspace --all-features

  package:
    name: Package crate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-build
      # The protos live at the repo root and reach the crate by symlink, so a
      # tarball build is the only thing that proves the published crate compiles.
      - name: Verify the packaged crate builds
        run: cargo package --locked -p connectrpc-tauri

  # Proves the npm package builds from a clean checkout, which `hk` does not do.
  build-package:
    name: Build package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
