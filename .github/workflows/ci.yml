name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # `hk check` is the single source of truth for lint and format, so CI and the
  # pre-commit hook cannot disagree. It covers rustfmt, clippy, cargo-deny, the
  # workflow linters, typecheck, vitest, and protobuf-binding drift.
  basics:
    name: Basics
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `gitleaks` scans history with `--log-opts=--all`, which a shallow
          # clone would silently narrow to one commit.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-build
      - name: Install dependencies
        # `knip`, `sherif`, `typecheck`, and `vitest` steps run through npm.
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level high
      - name: Run every check
        run: hk check --all --slow

  test:
    name: Test
    needs: basics
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-build
      # `hk` runs Vitest, but the Rust test suite remains a separate gate.
      - name: Run tests
        run: cargo test --workspace --all-features

  package:
    name: Package crate
    needs: basics
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-build
      # The protos live at the repo root and reach the crate by symlink, so a
      # tarball build is the only thing that proves the published crate compiles.
      - name: Verify the packaged crate builds
        run: cargo package --locked -p connectrpc-tauri

  # Proves the npm package builds from a clean checkout, which `hk` does not do.
  build-package:
    name: Build package
    needs: basics
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify npm package
        run: npm pack --dry-run --workspace @connectrpc-tauri/transport

  msrv:
    name: Rust 1.88.0
    needs: basics
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-build
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.88.0"
      - name: Check minimum supported Rust version
        run: rustup run 1.88.0 cargo check --locked --workspace
